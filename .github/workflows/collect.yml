# Hourly collector: fetch sources -> write data/*.json -> commit as the owner -> Vercel deploys.
# Rules (locked by tests/workflows.test.ts):
#   - every dynamic value reaches the shell through env:, never via an expression inside run:
#   - only data/ is staged; commit identity is the owner noreply address (D-10)
#   - runs are serialized (group collect, no cancellation) and check out the branch tip
name: collect

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: 'Sleep before commit (concurrency test only)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: 'Thales Guimarães Lopes'
      GIT_AUTHOR_EMAIL: '215318905+thalesguimalopes99@users.noreply.github.com'
      GIT_COMMITTER_NAME: 'Thales Guimarães Lopes'
      GIT_COMMITTER_EMAIL: '215318905+thalesguimalopes99@users.noreply.github.com'
    steps:
      - name: Checkout main (branch tip, not the trigger-time SHA)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect
        id: collect
        env:
          COLLECT_TRIGGER: ${{ github.event_name }}
        run: npm run collect

      - name: Hold (concurrency test aid)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hold_seconds != '0' }}
        env:
          HOLD: ${{ inputs.hold_seconds }}
        run: |
          case "$HOLD" in
            ''|*[!0-9]*) echo "::error::hold_seconds must be digits only"; exit 1 ;;
          esac
          if [ "$HOLD" -gt 600 ]; then
            echo "::error::hold_seconds must be <= 600"
            exit 1
          fi
          sleep "$HOLD"

      - name: Commit and push data
        id: push
        env:
          ITEMS_NEW: ${{ steps.collect.outputs.items_new }}
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          case "$ITEMS_NEW" in
            ''|*[!0-9]*) ITEMS_NEW=0 ;;
          esac
          TS="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): update feed ${TS} [+${ITEMS_NEW} itens]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Last attempt failed: stop here, no wasted pull/sleep.
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep $((attempt * 5))
            # `if !` keeps bash -e from killing the step before the annotation;
            # the abort is best-effort (no rebase exists after a fetch failure).
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::Pull/rebase failed (conflict or network); data not pushed"
              exit 1
            fi
            # The rebase replays our data commit onto a newer tip: revalidate it.
            if ! npm run validate:data; then
              echo "::error::Rebased data failed validation; not pushing"
              exit 1
            fi
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

      - name: Deploy Hook fallback (D-10, inert unless secret set)
        if: ${{ steps.push.outputs.pushed == 'true' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No deploy hook configured; Vercel Git integration handles deploys"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null

      - name: Fail run when all required sources failed
        if: ${{ steps.collect.outputs.run_status == 'failed' }}
        run: |
          echo "::error::All required sources failed (meta.json committed with error health)"
          exit 1
